[package]
name = "srchr"
version = "0.2.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "srchr"
path = "src/main.rs"

[lib]
name = "srchr"
path = "src/lib.rs"

[dependencies]
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1"
ratatui = "0.29"
crossterm = "0.28"
syntect = "5"
once_cell = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
