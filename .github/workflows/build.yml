name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example, v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate_release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          persist-credentials: false
      - name: Validate release tag and package version
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable vX.Y.Z format; received: $tag" >&2
            exit 1
          fi

          cargo_version="$(grep -m1 '^version = ' rust/Cargo.toml | cut -d '"' -f2)"
          if [ "$cargo_version" != "${tag#v}" ]; then
            echo "Cargo package version ($cargo_version) must match release tag ($tag)" >&2
            exit 1
          fi

  create_release:
    needs: validate_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false

  build:
    runs-on: ${{ matrix.runner }}
    needs: create_release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.version }}
    strategy:
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: srchr
          - name: macos-x86-64
            runner: macos-latest
            target: x86_64-apple-darwin
            artifact: srchr
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: srchr
          - name: linux-x86-64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: srchr
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: srchr.exe
          - name: windows-x86-64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: srchr.exe
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux aarch64 linker
        if: ${{ matrix.name == 'linux-aarch64' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux aarch64 linker
        if: ${{ matrix.name == 'linux-aarch64' }}
        run: |
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml

      - name: Install build target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target=${{ matrix.target }}

      - name: Upload raw artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: srchr-${{ env.RELEASE_TAG }}-${{ matrix.name }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Compress artifact
        run: tar -czf "../srchr-${RELEASE_TAG}-${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.artifact }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: srchr-${{ env.RELEASE_TAG }}-${{ matrix.name }}.tar.gz
