name: Build and Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false

  build:
    runs-on: ${{ matrix.runner }}
    needs: create_release
    strategy:
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact: srchr
          - name: macos-x86-64
            runner: macos-latest
            target: x86_64-apple-darwin
            artifact: srchr
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: srchr
          - name: linux-x86-64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: srchr
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: srchr.exe
          - name: windows-x86-64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: srchr.exe
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux aarch64 linker
        if: ${{ matrix.name == 'linux-aarch64' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux aarch64 linker
        if: ${{ matrix.name == 'linux-aarch64' }}
        run: |
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml

      - name: Install build target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target=${{ matrix.target }}

      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: srchr-${{ inputs.version }}-${{ matrix.name }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Compress artifact
        run: tar -czf ../srchr-${{ inputs.version }}-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.artifact }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          files: srchr-${{ inputs.version }}-${{ matrix.name }}.tar.gz
